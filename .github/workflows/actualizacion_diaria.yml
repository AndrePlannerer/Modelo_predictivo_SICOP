name: Actualización diaria SICOP

on:
  schedule:
    - cron: "30 10 * * *"  # Corre aproximadamente a las 08:30 am hora de Costa Rica (UTC-6); el Observatorio publica a las 08:00am.
  workflow_dispatch:
    inputs:
      forzar_reentrenamiento:
        description: "Reentrenar el modelo aunque no sea lunes"
        type: boolean
        default: false

# Evita que dos ejecuciones escriban el mismo sicop.duckdb al mismo tiempo.
concurrency:
  group: sicop-actualizacion-diaria
  cancel-in-progress: false

permissions:
  contents: write   # necesario para subir sicop.duckdb al Release
  issues: write     # necesario para crear el issue de aviso si algo falla

env:
  NOMBRE_RELEASE: datos_actuales_sicop

jobs:
  actualizar:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar sicop.duckdb y el modelo desde el Release (si ya existen)
        run: |
          mkdir -p data modelo
          if gh release view "$NOMBRE_RELEASE" >/dev/null 2>&1; then
            echo "Release '$NOMBRE_RELEASE' encontrado -- restaurando estado previo."
            gh release download "$NOMBRE_RELEASE" -p "sicop.duckdb" -D data/ --clobber
            gh release download "$NOMBRE_RELEASE" -p "clasificador_adjudicacion.joblib" -D modelo/ --clobber \
              || echo "El Release existe pero todavía no tiene un modelo entrenado; entrenando uno nuevo."
          else
            echo "::warning::No existe el Release '$NOMBRE_RELEASE' -- creando una base nueva desde cero. Si ya corriste el backfill antes con otro nombre de Release, revisa que NOMBRE_RELEASE coincida en ambos workflows."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar el mes vigente del Observatorio
        run: python etl/descarga.py

      - name: Transformar al modelo dimensional
        run: python etl/transforma.py

      - name: Cargar el mes vigente en DuckDB
        run: python etl/carga_staging.py

      - name: Reconstruir el esquema final
        run: python etl/construir_modelo_final.py

      - name: Reentrenar (lunes) o solo actualizar predicciones
        run: |
          if [ "${{ github.event.inputs.forzar_reentrenamiento }}" = "true" ]; then
            python modelo/entrena_y_predice.py --forzar
          else
            python modelo/entrena_y_predice.py
          fi

      - name: Publicar sicop.duckdb y el modelo actualizados en el Release
        run: |
          if gh release view "$NOMBRE_RELEASE" >/dev/null 2>&1; then
            gh release upload "$NOMBRE_RELEASE" data/sicop.duckdb --clobber
            gh release upload "$NOMBRE_RELEASE" modelo/clasificador_adjudicacion.joblib --clobber
          else
            gh release create "$NOMBRE_RELEASE" data/sicop.duckdb modelo/clasificador_adjudicacion.joblib \
              --title "Base de datos SICOP" \
              --notes "Se actualiza automáticamente todos los días."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear issue si algo falló
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falló la actualización diaria de SICOP - ${new Date().toISOString().slice(0, 10)}`,
              body: `Revisa los logs de la ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["etl", "automatico"]
            })
